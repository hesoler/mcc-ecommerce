server:
  port: 8082

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
